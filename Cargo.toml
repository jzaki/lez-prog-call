[package]
name = "lez-call"
version = "0.1.0"
edition = "2024"
description = "Read a LEZ program's interface from its guest source, encode its messages, and call it through the wallet"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
bs58 = "0.5"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
